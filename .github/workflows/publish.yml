name: Publication npm

# Déclenché par un tag semver, ex. : git tag v0.1.1 && git push origin v0.1.1
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

jobs:
  publish:
    name: Build et publication
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Obligatoire pour le Trusted Publishing : c'est ce jeton OIDC de courte
      # durée qui authentifie le workflow auprès de npm, sans aucun secret.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          registry-url: https://registry.npmjs.org

      # Node 22 embarque npm 10.9, or le Trusted Publishing exige npm >= 11.5.1.
      - name: Mise à jour de npm
        run: npm install -g npm@latest

      - name: Versions utilisées
        run: node -v && npm -v

      - name: Installation des dépendances
        run: npm ci

      - name: Cohérence entre le tag et la version du package
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Le tag ($TAG) ne correspond pas à la version du package ($PKG)." >&2
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # Aucun NODE_AUTH_TOKEN : l'authentification passe par l'OIDC ci-dessus.
      # La provenance est générée automatiquement, et l'accès public vient de
      # publishConfig dans le package.json.
      - name: Publication
        run: npm publish
